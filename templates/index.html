<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Advisor AI</title><style>body{font-family:Arial,sans-serif;margin:0;background:#0b1020;color:#eef2ff}.wrap{max-width:1050px;margin:auto;padding:40px 20px}.hero h1{font-size:44px;margin:0 0 10px}.hero p{color:#aab4d0;font-size:17px}.card{background:#151c31;border:1px solid #293454;border-radius:18px;padding:24px;margin-top:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field label{display:block;color:#aab4d0;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #35405f;background:#0f1528;color:white}.actions{margin-top:22px}.btn{border:0;border-radius:10px;padding:13px 20px;background:#6d7cff;color:white;font-weight:bold;cursor:pointer}.result{display:none}.score{font-size:36px;font-weight:bold}.rank{display:flex;justify-content:space-between;border-bottom:1px solid #293454;padding:10px 0}.tags span{display:inline-block;background:#222b47;border-radius:20px;padding:7px 10px;margin:5px}.step{padding:10px 0;border-bottom:1px solid #293454}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><section class="hero"><h1>Career Advisor AI</h1><p>ML-powered career matching with ranked recommendations, skill guidance and a practical roadmap.</p></section><section class="card"><h2>Profile assessment</h2><p>Rate each area from 1 (low) to 5 (high).</p><form id="form"><div class="grid" id="fields"></div><div class="actions"><button class="btn">Analyze my career</button></div></form></section><section class="card result" id="result"><h2>Recommended path</h2><div class="score" id="career"></div><p id="summary"></p><p><b>Match score:</b> <span id="score"></span>%</p><h3>Top matches</h3><div id="ranking"></div><h3>Useful skills</h3><div class="tags" id="skills"></div><h3>Suggested roadmap</h3><div id="roadmap"></div></section></main><script>const fields=['sslc','hsc','cgpa','school_type','no_of_miniprojects','no_of_projects','coresub_skill','aptitude_skill','problemsolving_skill','programming_skill','abstractthink_skill','design_skill','first_computer','first_program','lab_programs','ds_coding','technology_used','sympos_attend','sympos_won','extracurricular','learning_style','college_bench','clg_teachers_know','college_performence','college_skills'];const box=document.getElementById('fields');fields.forEach(f=>box.innerHTML+=`<div class="field"><label>${f.replaceAll('_',' ')}</label><input name="${f}" type="number" min="1" max="5" value="3" required></div>`);document.getElementById('form').onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(e.target));const res=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(data.error){alert(data.error);return}document.getElementById('result').style.display='block';document.getElementById('career').textContent=data.recommendation.career;document.getElementById('score').textContent=data.recommendation.score;document.getElementById('summary').textContent=data.career_info.summary;document.getElementById('ranking').innerHTML=data.ranking.map(x=>`<div class="rank"><span>${x.career}</span><b>${x.score}%</b></div>`).join('');document.getElementById('skills').innerHTML=data.career_info.skills.map(x=>`<span>${x}</span>`).join('');document.getElementById('roadmap').innerHTML=data.career_info.roadmap.map((x,i)=>`<div class="step">${i+1}. ${x}</div>`).join('');window.scrollTo({top:document.getElementById('result').offsetTop,behavior:'smooth'});};</script></body></html>
